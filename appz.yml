app:
    name: alertmanager
    code: alertmanager
    notify: kullas@maximaconsulting.com

build:
    version: 0.27
    env: PROD
    build_file: none
    output_files: output/*.zip
    image_template: alertmanager-0.27

deploy:
    context: alpha/PROD
    type: statefulset
    replicas: 1
    port:
    - 9093
    nodeSelector:
      nodepool: cloudorbit
    tolerations:
      - key: nodepool
        operator: Equal
        value: cloudorbit
        effect: NoSchedule

volumes:
  - claim: alertmanager-data
    class: linode-block-storage
    mount: /appz/data
    name: data
    size: 50Gi
    matchLabels: false
  
properties:
    SLACK_API_URL:
      vault: SLACK_API_URL
    SLACK_CHANNEL: appz-delivery
    SLACK_VV_ALERT_API_URL:
       vault: SLACK_VV_ALERT_API_URL
    SLACK_VV_ALERT_CHANNEL: vv-alert   
    CLUSTER_NAME: VV-PROD-CloudOrbit
    revision : 1
