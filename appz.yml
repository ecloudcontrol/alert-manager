app:
    name: alertmanager
    code: alertmanager
    notify: appz@ecloudcontrol.com

build:
    version: 0.28
    env: DEV1
    build_file: none
    output_files: output/*.zip
    image_template: alertmanager-0.28

deploy:
    context: alpha/DEV1
    type: statefulset
    replicas: 1
    port:
    - 9093


volumes:
  - claim: alertmanager-data
    mount: /appz/data
    name: data
    size: 50Gi
    matchLabels: false

properties:
    #SLACK_API_URL:
     # vault: SLACK_API_URL
    SLACK_API_URL_ONE:
      vault: SLACK_API_URL_ONE
    SLACK_API_URL_TWO:
      vault: SLACK_API_URL_TWO
    CHANNEL_1: appz-delivery 
    CHANNEL_2: plantmaster-alerts
    SLACK_CHANNEL: notification-openebs
    revision : 12
